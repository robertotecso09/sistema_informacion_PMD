<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plataforma de seguimiento PMD Huimanguillo 2024–2027</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#1b2733;--mute:#5b6b7b;--line:#d9e0e8;--pri:#0b5c7a;--pri2:#e3f1f6;--rec:#0a7d4f;--rec2:#e2f4ea;--hit:#2f55c8;--hit2:#e6ecfb;--warn:#8a5300;--warn2:#fff1d6;--bad:#b3261e;--bad2:#fde7e5;--ok:#0a7d4f}
@media (prefers-color-scheme:dark){:root{--bg:#111820;--card:#18222d;--ink:#e6edf3;--mute:#9fb0c0;--line:#2c3a49;--pri:#5cc0e0;--pri2:#16384a;--rec:#58d39b;--rec2:#12362a;--hit:#8fb0ff;--hit2:#1d2b55;--warn:#ffc15e;--warn2:#47340d;--bad:#ff8a80;--bad2:#4a1f1c;--ok:#58d39b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Liberation Sans",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
header.top{background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:5}
.brand{font-weight:700;color:var(--pri)}.brand small{display:block;font-weight:400;color:var(--mute);font-size:12px}
.sp{flex:1}
main{max-width:1100px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
h1{font-size:22px;margin:0 0 6px}h2{font-size:17px;margin:0 0 10px}h3{font-size:15px;margin:0 0 6px}
.mute{color:var(--mute)}.small{font-size:13px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 14px;cursor:pointer;min-height:38px}
.btn:hover{border-color:var(--pri)}.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.sm{padding:4px 10px;min-height:30px;font-size:13px}.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chip{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid var(--line);white-space:nowrap}
.chip.rec{background:var(--rec2);color:var(--rec);border-color:transparent}.chip.hit{background:var(--hit2);color:var(--hit);border-color:transparent}
.chip.warn{background:var(--warn2);color:var(--warn);border-color:transparent}.chip.bad{background:var(--bad2);color:var(--bad);border-color:transparent}.chip.ok{background:var(--rec2);color:var(--ok);border-color:transparent}.chip.pri{background:var(--pri2);color:var(--pri);border-color:transparent}
.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g5{grid-template-columns:repeat(5,1fr)}
@media(max-width:760px){.g2,.g3,.g5{grid-template-columns:1fr 1fr}}@media(max-width:480px){.g2,.g3,.g5{grid-template-columns:1fr}}
.stat{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--card)}.stat b{font-size:24px;display:block;line-height:1.1}.stat span{font-size:12px;color:var(--mute)}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}.tab{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:14px}.tab[aria-selected=true]{background:var(--pri);color:#fff;border-color:var(--pri)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.filters input,.filters select{flex:1;min-width:140px}
input[type=text],input[type=search],input[type=date],select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
textarea{min-height:90px;resize:vertical}
.row{display:grid;grid-template-columns:90px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}.row .code{font-weight:700;font-variant-numeric:tabular-nums}
.row .desc{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
@media(max-width:640px){.row{grid-template-columns:1fr}}
.field{margin:0 0 14px}.lbl{display:flex;gap:8px;align-items:center;margin-bottom:4px;font-weight:600}
.help{width:24px;height:24px;border-radius:50%;border:1px solid var(--pri);background:var(--pri2);color:var(--pri);font-weight:700;cursor:pointer;padding:0;line-height:1}
.helpbox{border:1px solid var(--pri);background:var(--pri2);border-radius:8px;padding:10px 12px;margin:0 0 8px;font-size:14px}
.helpbox p{margin:0 0 6px}.helpbox .ok{color:var(--ok)}.helpbox .no{color:var(--bad)}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer;background:var(--card)}
.opt input{margin-top:4px;width:18px;height:18px;flex:none}.opt.sel{border-color:var(--pri);background:var(--pri2)}
.opt b{display:block}.opt span{font-size:13px;color:var(--mute)}
.suffix{display:flex;gap:8px;align-items:center}.suffix input{max-width:200px}
.msg{border-radius:8px;padding:10px 12px;margin:0 0 12px;font-size:14px}.msg.bad{background:var(--bad2);color:var(--bad)}.msg.warn{background:var(--warn2);color:var(--warn)}.msg.info{background:var(--pri2);color:var(--pri)}.msg.ok{background:var(--rec2);color:var(--ok)}
.msg ul{margin:4px 0 0 18px;padding:0}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.03em}
.tw{overflow-x:auto}
.crumb{font-size:13px;color:var(--mute)}.crumb b{color:var(--ink)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto;z-index:20}
#modal .box{background:var(--card);border-radius:12px;max-width:640px;width:100%;padding:18px;border:1px solid var(--line)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.banner{background:var(--warn2);color:var(--warn);text-align:center;font-size:12px;padding:3px}
a{color:var(--pri)}

:root{--bg:#f2f5f9;--card:#fff;--ink:#172b3a;--mute:#607486;--line:#dbe4ec;--pri:#075985;--pri2:#e6f4fb;--rec:#087f5b;--rec2:#e5f7ef}
body{background:radial-gradient(ellipse at 10% 0%,#e5f2fb 0,transparent 38%),var(--bg);font-size:15px}
header.top{padding:14px clamp(16px,3vw,36px);box-shadow:0 3px 18px #18354b0a}
.brand{font-size:16px;letter-spacing:-.02em}.brand small{margin-top:2px}
main{max-width:1280px;padding:clamp(14px,2.4vw,30px)}
.card{border-radius:16px;padding:clamp(16px,2vw,24px);box-shadow:0 8px 28px #18354b0a;margin-bottom:18px}
h1{font-size:clamp(23px,3vw,30px);letter-spacing:-.035em;line-height:1.2}h2{font-size:19px;letter-spacing:-.02em}
.btn,.tab{transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease}.btn:hover{box-shadow:0 4px 12px #07598518;transform:translateY(-1px)}
.stat{border-radius:13px;padding:15px;background:linear-gradient(145deg,var(--card),var(--bg))}.stat b{font-size:28px;letter-spacing:-.04em;margin:5px 0}
.tabs{gap:8px}.tab{padding:9px 14px;border-radius:10px;font-weight:600}
input[type=text],input[type=search],input[type=date],input[type=email],input[type=password],select,textarea{min-height:42px;border-radius:10px;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 16%,transparent)}
.field{margin-bottom:17px}.lbl{margin-bottom:7px}.row{padding:14px 0;grid-template-columns:110px minmax(0,1fr) auto}.row .desc{line-height:1.45}
table th{background:var(--bg);position:sticky;top:0}th,td{padding:10px}#modal .box{border-radius:18px;box-shadow:0 24px 80px #061b2b35}
.login-hero{background:linear-gradient(135deg,#063b5b,#087e9d);color:white;border-radius:16px;padding:24px;margin:-2px -2px 22px}.login-hero p{color:#dceff6;margin:8px 0 0}
.login-layout{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(280px,.9fr);gap:24px;align-items:start}.login-aside{border:1px solid var(--line);border-radius:14px;padding:18px;background:var(--bg)}
@media(max-width:700px){.login-layout{grid-template-columns:1fr}.row{grid-template-columns:1fr}.card{padding:16px}}

</style>
</head>

<div id="app"><main><div class="card"><h1>Plataforma de seguimiento del PMD</h1><p>Conectando con el servidor institucional…</p></div></main></div>

<script>
const DATA={"ejes":{"EJE I":"Gobierno honesto, democrático y participativo","EJE II":"Infraestructura para el desarrollo y servicios municipales","EJE III":"Derechos sociales, bienestar y reducción de la desigualdad","EJE IV":"Desarrollo rural y económico con perspectiva regional","EJE V":"Impulso a la educación, cultura, recreación y deporte","EJE VI":"Medio ambiente, energía y desarrollo territorial","EJE VII":"Seguridad y construcción de la paz","EJE VIII":"Rendición de cuentas, transparencia y combate a la corrupción"},"objs":{"1.1":"Promover un gobierno cercano a la gente, democrático y participativo, con un enfoque humanista, propiciando la inclusión democrática de la población y ofreciendo un trato respetuoso y digno.","2.1":"Desarrollar, modernizar y mantener la infraestructura física del municipio de Huimanguillo para garantizar el acceso a servicios públicos esenciales, la mejora de los espacios públicos urbanos y rurales, así como las vías de comunicación, contribuyendo al bienestar de la población, promoviendo un desarrollo territorial equilibrado y sostenible.","2.2":"Garantizar la calidad y cobertura de los servicios municipales promoviendo el bienestar y la limpieza mediante la mejora de las actividades de limpia y recolección de basura; mantenimiento de calles, parques, jardines y monumentos; alumbrado público, bacheo, así como mantenimiento de la red de agua, drenaje y alcantarillado.","3.1":"Promover una política social que apoye la atención, inclusión y convivencia para las personas con discapacidad en condición de vulnerabilidad, mediante el desarrollo de proyectos y programas destinados a mejorar su calidad de vida, brindando un rostro humano que transforme su entorno y facilite su integración a su comunidad.","3.2":"Ampliar programas de asistencia social dirigidos a los adultos mayores, cualquiera que sea su situación social, promoviendo el respeto y la protección de sus derechos fundamentales.","3.3":"Mejorar el acceso a la alimentación de calidad entre los grupos de población que presente mayor vulnerabilidad social, para favorecer el derecho que tiene a la alimentación nutritiva, suficiente y de calidad.","3.4":"Incrementar las acciones de asistencia social orientadas a la difusión, respeto, vigilancia y/o restitución de los derechos de niñas, niños y adolescentes, que acorde a la legislación y normatividad vigente, demanden atención, protección y cuidados específicos, así como atender los centros destinados a esta población vulnerable.","3.5":"Fortalecer y promover la integración familiar, que es la base para la formación de valores y principios, para lograr una mayor cohesión social y solidaridad comunitaria.","3.6":"Implementar medidas de protección especial ante riesgos inminentes contra la vida, integridad o libertad de niñas, niños y adolescentes.","3.7":"Contribuir a la igualdad sustantiva entre mujeres y hombres, así como el acceso a una vida libre de violencia, mediante la promoción del ejercicio pleno de sus derechos y la cobertura efectiva en los servicios de prevención y atención para casos de violencia, con el fin de contribuir a su empoderamiento social y económico. Así mismo propiciar la no discriminación y la paridad de género, entre mujeres y hombres para su pleno desarrollo en los ámbitos familiar, social y laboral.","3.8":"Coadyuvar con el gobierno federal y estatal en la implementación de políticas públicas que promuevan la atención, prevención y control de los principales problemas de salud pública, a fin de contribuir al bienestar de la población.","3.9":"Generar las condiciones para facilitar el acceso pleno a derechos, cultura, desarrollo social, económico y político de los pueblos y comunidades indígenas.","4.1":"Incrementar la producción agropecuaria mediante el aprovechamiento de las condiciones de clima y suelo favorables, así como las capacidades y experiencia de los productores, para ser competitivos en los mercados potenciales, apoyar la autosuficiencia alimentaria y contribuir a mejorar las condiciones de vida de los habitantes en zonas rurales.","4.2":"Generar nuevas fuentes de empleo en el campo, fomentando la creación de pequeñas y medianas empresas agrícolas, ganaderas y acuícolas en Huimanguillo.","4.3":"Impulsar el desarrollo económico local mediante el fortalecimiento de capacidades productivas, comercialización en nuevos mercados, facilitar el acceso al financiamiento y promover la atracción de inversiones, que promueva la generación y conservación de empleo en beneficios de emprendedores y MiPymes locales.","4.4":"Posicionar a Huimanguillo como un destino turístico atractivo, promoviendo el ecoturismo, agroturismo y turismo cultural, aprovechando atractivos naturales, patrimonio histórico y fiestas regionales.","5.1":"Promover el acceso de la población a la educación integral, que incluye el estudio, la sana alimentación, la salud física y mental, la ciencia, la cultura, el deporte y las tecnologías de la información y comunicación.","5.2":"Vincular la política del deporte en el municipio a la promoción de distintas disciplinas deportivas entre niñas, niños y jóvenes, pero también extender la cobertura a la población vulnerable, como personas con discapacidad y adultos mayores que normalmente están excluidos, para fomentar la recreación y la actividad física.","5.3":"Impulsar espacios de oportunidad para un desarrollo sano e inclusivo de la juventud de Huimanguillo.","6.1":"Ser un municipio con un enfoque de desarrollo sustentable, que en equilibrio, preserve el medio ambiente y propicie las actividades productivas, energéticas y el quehacer cotidiano de la población, orientándola al aprovechamiento racional de los recursos naturales y al respeto al entorno.","7.1":"Fortalecer la confianza entre ciudadanía y cuerpos de seguridad municipal, que permita llevar a cabo una labor coordinada con el estado y la federación de manera eficiente en el combate y la prevención de delitos, especialmente los relacionados a la violencia de género.","7.2":"Brindar seguridad vial y peatonal a la ciudadanía, para tener condiciones dignas y seguras de movilidad para la población en general.","7.3":"Salvaguardar los bienes y la integridad de la población de Huimanguillo mediante la operación eficiente de los mecanismos de protección civil.","8.1":"Incrementar los ingresos municipales propios y los ingresos de fuentes adicionales de recursos, fortaleciendo la participación ciudadana, la cultura del pago de impuestos y la rendición de cuentas.","8.2":"Vincular la planeación democrática con la programación de los recursos disponibles, que asegure el cumplimiento de los objetivos y líneas de acción derivados del PMD 2024-2027.","8.3":"Consolidar una gestión pública con enfoque a resultados que impacte en el bienestar de la población y desarrollo del Municipio.","8.4":"Proporcionar en tiempo y forma los recursos humanos y materiales que las dependencias y coordinaciones del Ayuntamiento requieran, para el cumplimiento de sus objetivos y líneas de acción comprometidas en el Plan Municipal de Desarrollo 2024-2027.","8.5":"Asegurar el cumplimiento de las políticas y programas establecidos por el Ayuntamiento con respecto al gasto público, cuidando el cumplimiento de las normas de control interno establecidas, para que los recursos públicos se ejerzan con eficiencia, honestidad y transparencia.","8.6":"Implementar una gestión municipal que prevenga y combata a la corrupción mediante la estricta aplicación de los criterios para el ejercicio del gasto público: eficacia, eficiencia, economía, honestidad y transparencia.","8.7":"Tener una comunicación permanente sobre el ejercicio del gasto público y las actividades que con él se realizan, disponibles en todo momento a la población, para su conocimiento y en su caso verificación."},"ests":{"1.1.1":"Propiciar la atención y comunicación directa de los representantes del Gobierno Municipal con la población, generar las condiciones de participación democrática de los habitantes, así como generar consensos entre los integrantes del Cabildo Municipal, para lograr un gobierno que beneficie a la sociedad, privilegiando una política de austeridad, honestidad y transparencia.","1.1.2":"Garantizar la aplicación del marco jurídico que permita el desarrollo pleno del estado de derecho en el municipio, que facilite el acceso a servicios registrales, así como a documentación requerida para trámites ante instituciones públicas y privadas.","2.1.1":"Desarrollar un programa integral de infraestructura que atienda a las necesidades prioritarias, realice una planeación eficiente y optimice los recursos disponibles, para garantizar la construcción, modernización y mantenimiento continuo de la infraestructura física del municipio, respondiendo a las necesidades de servicios básicos, espacios públicos y vías de comunicación entre el municipio.","2.2.1":"Implementar un sistema de control de servicios municipales que aborde de manera integral las actividades a cargo del Ayuntamiento, que permita optimizar los recursos disponibles y atender la demanda ciudadana oportunamente.","3.1.1":"Desarrollar un programa integral de atención para personas en situación vulnerable, enfocando los esfuerzos en las personas que tengan una discapacidad permanente, personas postradas en cama por enfermedad, así como familias que enfrenten rezago alimentario, apoyando el acceso al bienestar familiar en colaboración con las dependencias e instituciones estatales y federales.","3.2.1":"Proporcionar atención integral a la población adulta mayor en el municipio, promoviendo acciones para mejorar su calidad de vida, brindando apoyo y atención para mejorar su condición de salud, económica, ocupacional y de convivencia social.","3.3.1":"Mejorar la operatividad y aumentar los alcances de las áreas asistenciales municipales, promoviendo la colaboración con los distintos órdenes de gobierno, a fin de cumplir los objetivos y funciones específicas de cada uno para apoyar y asistir a la población.","3.4.1":"Desarrollar programas enfocados en el desarrollo integral de niñas, niños y adolescentes, esto incluye las acciones en materia de educación, acompañamiento, protección de derechos, así como su participación en actividades artísticas y culturales.","3.5.1":"Desarrollar programas y acciones que promuevan una sana convivencia y desarrollo en las familias y sus integrantes; así como apoyar a grupos vulnerables.","3.6.1":"Diseñar, promover e implementar conjuntamente con la autoridad jurisdiccional competente, las medidas urgentes de protección dentro del marco normativo.","3.7.1":"Difundir, promover y gestionar el respeto de los derechos humanos de las mujeres y la prevención de la violencia en todos sus tipos y ámbitos de ocurrencia, mediante estrategias de información y comunicación con alcance estatal y regional, mediante la colaboración con los órdenes de gobierno Estatal y Federal.","3.8.1":"Promover y apoyar programas en coordinación con otros órdenes de gobierno para enfrentar los principales problemas salud pública, como contingencias epidemiológicas; control de mosquitos; salud integral del niño y adolescente; salud sexual y reproductiva; prevención y atención para la diabetes; salud mental y atención a adultos mayores.","3.9.1":"Promover una serie de acciones que permitan el reconocimiento como pueblos indígenas, mejoramiento de infraestructura básica social, fortalecimiento de identidad, cultura y tradiciones, así como desarrollo económico y político.","4.1.1":"Desarrollar programas de apoyo a la productividad en las unidades de producción agropecuarias, mediante la dotación de insumos, equipamiento y capacitación adecuada, que permita mejorar las capacidades de los productores locales.","4.2.1":"Establecer un modelo de apoyo al emprendimiento rural, proporcionando capacitación, asesoría, y microcréditos a los productores y emprendedores agropecuarios, para la creación de nuevas fuentes de empleo.","4.3.1":"Desarrollar una estrategia integral de apoyos para emprendedores, comercio, industria y servicios, así como un programa de incentivos para la atracción de inversiones, que contribuya al crecimiento económico regional.","4.4.1":"Generar productos turísticos y los instrumentos de promoción necesarios, a fin de crear y fortalecer empresas que ofrezcan productos turísticos, para atraer visitantes locales, estatales, nacionales e internacionales.","5.1.1":"Fomentar el apoyo a la educación en todos sus niveles para su desarrollo integral de alumnos y docentes, así como la promoción de la investigación; la gestión de programas de educación básica para reducir el analfabetismo o terminación de estudios, de las instancias estatal y federal.","5.1.2":"Promover actividades artísticas, culturales y aquellas que preservan nuestras tradiciones e identidad, con carácter inclusivo y dinamicen la participación ciudadana a fin de fortalecer los lazos comunitarios.","5.2.1":"Fomentar la práctica del deporte y la recreación entre los habitantes del municipio, así como ampliar las posibilidades de acceso en forma regular y organizada a la práctica de actividades físicas y deportivas, especialmente a la población vulnerable.","5.3.1":"Fortalecer los apoyos municipales en coadyuvancia con los programas para la juventud del Estado y la Federación.","6.1.1":"Diseñar y promover programas y proyectos en las zonas urbanas y rurales para el cuidado del medio ambiente, así como el adecuado manejo de residuos sólidos, aguas residuales, las emisiones al aire libre contaminantes y contaminación auditiva.","6.1.2":"Promover un programa de trabajo conjunto con los participantes en el sector energético, que permita desarrollar obras de beneficio social y mejoramiento de infraestructura básica en comunidades ubicadas en la zona de influencia de este sector.","6.1.3":"Orientar las actividades productivas y el desarrollo urbano de forma ordenada territorialmente, con respeto al medio ambiente para propiciar la convivencia social y la adecuada regulación de uso del suelo.","7.1.1":"Consolidar el área de seguridad pública como un cuerpo de paz y una corporación policial de proximidad con presencia en todo el Municipio; asimismo se fortalecerá la capacitación de sus elementos en perspectiva de género y el desarrollo de mayores capacidades para el cumplimiento de la función.","7.1.2":"Coordinación permanente de las estrategias de seguridad pública con los gobiernos Estatal y Federal para mitigar la incidencia delictiva y llevar ante la justicia a los infractores de la ley. En su función de seguridad preventiva, dar espacio al uso de la inteligencia policial en coordinación con los cuerpos de seguridad Estatal y Federal.","7.2.1":"Instrumentar acciones y programas para mejorar la infraestructura vial, el ordenamiento del tránsito y la vialidad, incluyendo fortalecer la cultura de respeto vial en la población, para lograr una seguridad integral en materia de tránsito y vialidad.","7.3.1":"Mejorar la prevención y operatividad del sistema municipal de Protección Civil ante contingencias naturales o de carácter antropogénico, que pongan en riesgo a la población y sus bienes.","8.1.1":"Instrumentar acciones que aumenten la participación de los contribuyentes y fortalezcan las finanzas públicas del Municipio.","8.2.1":"Establecer los criterios e integrar los programas operativos anuales del Ayuntamiento, atendiendo al cumplimiento del PMD 2024-2027.","8.2.2":"Conforme al mandato constitucional de la Federación y Estatal, referido a los criterios para ejercer el gasto público, deberá aplicar los procesos de evaluación que con dicho fin implemente el Ayuntamiento.","8.3.1":"Establecer mecanismos orientados a resultados que vinculen los procesos de planeación, programación, presupuestación, ejercicio, control y evaluación para la creación de valor público.","8.4.1":"Cuidar y facilitar que se cumplan los diversos ordenamientos administrativos de organización y control en el manejo de los recursos humanos y materiales del Municipio, siempre cuidando cumplir con los criterios de austeridad, eficiencia, honestidad y transparencia, en el uso de los recursos mencionados.","8.5.1":"Establecer mecanismos de revisión permanente para verificar el cumplimento del sistema de control interno, de acuerdo a la normatividad aplicable en materia de rendición de cuentas.","8.6.1":"Establecer un modelo administrativo de evaluación, control y seguimiento que verifique el cumplimiento de los criterios señalados en el objetivo antes expuesto.","8.7.1":"Cumplir con los ordenamientos legales en la materia, generar acciones para difundir públicamente los resultados e incentivar la participación ciudadana."},"lines":[{"c":"1.1.1.1","eje":"EJE I","o":"1.1","s":"1.1.1","d":"Mantener la gobernabilidad en el municipio mediante la toma de decisiones en reuniones de Cabildo, privilegiando el diálogo, el consenso y la participación democrática de todos sus integrantes, a fin de tener una adecuada gobernanza municipal.","a":["Secretaría del Ayuntamiento"],"u":"sesiones de cabildo","m":"Libro de actas de cabildo"},{"c":"1.1.1.2","eje":"EJE I","o":"1.1","s":"1.1.1","d":"Promover cambios a la Ley Orgánica de Los Municipios del Estado de Tabasco, para proponer la elección de delegados municipales mediante el voto popular y así contar con representantes municipales emanados del pueblo.","a":["Secretaría del Ayuntamiento"],"u":"Delegados electos","m":""},{"c":"1.1.1.3","eje":"EJE I","o":"1.1","s":"1.1.1","d":"Mantener una comunicación permanente con los delegados, con la finalidad de impulsar un contacto directo con las necesidades y problemas de los habitantes de las comunidades que representan.","a":["Secretaría del Ayuntamiento"],"u":"Reunion","m":"Reporte mensual de los delegados"},{"c":"1.1.1.4","eje":"EJE I","o":"1.1","s":"1.1.1","d":"Realizar audiencias ciudadanas otorgadas de manera directa en el Palacio Municipal y en encuentros ciudadanos con la sociedad civil.","a":["Secretaría del Ayuntamiento"],"u":"CIUDADANOS ATENDIDOS","m":"BITACORA DE AUDIENCIA"},{"c":"1.1.1.5","eje":"EJE I","o":"1.1","s":"1.1.1","d":"Desarrollar jornadas de atención ciudadana en territorio, con la finalidad de brindar audiencias públicas en colonias, poblados, villas y ciudades del municipio, facilitando el acceso a los servicios, programas y acciones del Gobierno Municipal.","a":["Secretaría del Ayuntamiento"],"u":"JORNADAS TRABAJO REALIZADAS","m":"AGENDA"},{"c":"1.1.1.6","eje":"EJE I","o":"1.1","s":"1.1.1","d":"Coadyuvar con el Gobierno Estatal en su programa permanente de atender directamente a las comunidades, llevando presencialmente los servicios y atención de las dependencias estatales y federales.","a":["Secretaría del Ayuntamiento"],"u":"JORNADAS TRABAJO REALIZADAS","m":"AGENDA"},{"c":"1.1.1.7","eje":"EJE I","o":"1.1","s":"1.1.1","d":"Comunicar a la sociedad los programas, acciones, proyectos y actividades del gobierno municipal, de forma oportuna y accesible a la comprensión de la población, utilizando medios de comunicación social tradicionales, plataformas digitales y redes sociales.","a":["Secretaría del Ayuntamiento"],"u":"EVENTOS DIFUNDIDOS","m":"INFORME DE COMUNICACIÓN SOCIAL"},{"c":"1.1.2.1","eje":"EJE I","o":"1.1","s":"1.1.2","d":"Mejorar la prestación de servicios de las oficialías del Registro Civil en torno a la emisión de actas de nacimiento, matrimonios, defunción, divorcios, CURP, así como la promoción de jornadas colectivas de registro.","a":["Secretaría del Ayuntamiento"],"u":"Tramites","m":"Folios y expediente de tramites"},{"c":"1.1.2.2","eje":"EJE I","o":"1.1","s":"1.1.2","d":"Facilitar a los ciudadanos el acceso a trámites de constancias de radicación, identidad, residencia, unión libre, buena conducta, dependencia económica, así como los de validación de marca de ganado y madera como son inscripción, baja y anualidad.","a":["Secretaría del Ayuntamiento"],"u":"Tramites","m":"Folios y expediente de tramites"},{"c":"1.1.2.3","eje":"EJE I","o":"1.1","s":"1.1.2","d":"Fortalecer la operación de la Junta Municipal de Reclutamiento, para facilitar la atención a jóvenes y remisos de tal manera que logren obtener su cartilla militar.","a":["Secretaría del Ayuntamiento"],"u":"Tramites","m":"Expedientes"},{"c":"1.1.2.4","eje":"EJE I","o":"1.1","s":"1.1.2","d":"Brindar asesoría jurídica a las personas que la soliciten, en temas relacionados con trámites ante el Ayuntamiento, gobierno estatal y federal, así como asuntos de carácter personal.","a":[],"u":"","m":""},{"c":"1.1.2.5","eje":"EJE I","o":"1.1","s":"1.1.2","d":"Reducir la cantidad de expedientes laborales que enfrenta el Ayuntamiento, mediante la atención de laudos determinados por la autoridad judicial, así como la utilización de procesos conciliatorios para la solución de conflictos entre las partes.","a":["Dirección de Asuntos Jurídicos"],"u":"Expedientes laborales","m":"En base a expedientes físicos que obran el la Dirección."},{"c":"1.1.2.6","eje":"EJE I","o":"1.1","s":"1.1.2","d":"Realizar el censo general de asociaciones religiosas y coordinar acciones para facilitar su desarrollo, en un marco de respeto sin distinción de credo, raza y posición social.","a":["Secretaría del Ayuntamiento"],"u":"Tramites","m":"Solicitudes"},{"c":"1.1.2.7","eje":"EJE I","o":"1.1","s":"1.1.2","d":"Informar a las comunidades acerca de los programas que realizará el Ayuntamiento, así como los del orden estatal y federal, a fin de que nadie se quede sin los apoyos de los tres niveles de gobierno.","a":["Secretaría del Ayuntamiento"],"u":"EVENTOS DIFUNDIDOS","m":"INFORME DE COMUNICACIÓN SOCIAL"},{"c":"2.1.1.1","eje":"EJE II","o":"2.1","s":"2.1.1","d":"Realizar el mantenimiento, rehabilitación y construcción de los sistemas de captación y suministro de agua potable, para lograr abatir el rezago en zonas de atención prioritaria y localidades con mayor índice de pobreza.","a":[],"u":"","m":""},{"c":"2.1.1.2","eje":"EJE II","o":"2.1","s":"2.1.1","d":"Construcción de redes de drenaje y alcanta {"c":"2.1.2.6","eje":"EJE II","o":"2.1","s":"2.1.1","d":"Remodelación de la central camionera de Huimanguillo, para hacer que sea más funcional y otorgue un mejor servicio a los usuarios.","a":[],"u":"","m":""},{"c":"2.1.3.1","eje":"EJE II","o":"2.1","s":"2.1.1","d":"Rehabilitación y mantenimiento de campos deportivos y espacios recreativos.","a":[],"u":"","m":""},{"c":"2.1.3.2","eje":"EJE II","o":"2.1","s":"2.1.1","d":"Construir nuevos espacios deportivos en comunidades que carecen de infraestructura para fomentar la actividad física y el deporte, asegurando que sean accesibles para personas con discapacidad.","a":["Dirección de Obras Públicas"],"u":"OBRAS (TEMPORALMENTE)","m":""},{"c":"2.1.3.3","eje":"EJE II","o":"2.1","s":"2.1.1","d":"Mejorar espacios recreativos mediante la modernización del mobiliario urbano, incorporación de juegos infantiles de mayor actualidad y renovación de la vegetación, en parques, plazas, jardines y monumentos.","a":[],"u":"","m":""},{"c":"2.1.4.1","eje":"EJE II","o":"2.1","s":"2.1.1","d":"Ampliación de la red de distribución eléctrica en media y baja tensión en zonas que aún no cuentan con acceso, priorizando zonas de atención que son estratégicas y tienen una alta densidad poblacional.","a":["Dirección de Obras Públicas"],"u":"OBRAS","m":""},{"c":"2.1.4.2","eje":"EJE II","o":"2.1","s":"2.1.1","d":"Rehabilitación a la red de distribución eléctrica en media y baja tensión, en zonas donde la infraestructura existente de energía eléctrica está en malas condiciones o es insuficiente.","a":[],"u":"","m":""},{"c":"2.1.4.3","eje":"EJE II","o":"2.1","s":"2.1.1","d":"Construcción y rehabilitación del sistema de alumbrado público municipal.","a":[],"u":"","m":""},{"c":"2.1.5.1","eje":"EJE II","o":"2.1","s":"2.1.1","d":"Implementar programas de mejoramiento de vivienda que incluyan la construcción de pisos, muros y techos, así como un cuarto adicional en caso de ser requerido, de acuerdo a la evaluación de la vivienda.","a":["Dirección de Obras Públicas"],"u":"","m":""},{"c":"2.1.5.2","eje":"EJE II","o":"2.1","s":"2.1.1","d":"Gestionar la construcción de vivienda ante el Gobierno del Estado de Tabasco, brindando el acompañamiento en la integración del censo de beneficiarios, así como en la implementación del programa.","a":["Dirección de Obras Públicas"],"u":"","m":""},{"c":"2.1.5.3","eje":"EJE II","o":"2.1","s":"2.1.1","d":"Promover la construcción de vivienda en coordinación con el Gobierno de México mediante la colaboración con la Secretaría del Bienestar, SEDATU, INFONAVIT y CONAVI.","a":["Dirección de Obras Públicas"],"u":"","m":""},{"c":"2.1.5.4","eje":"EJE II","o":"2.1","s":"2.1.1","d":"Desarrollar el programa de dotación de materiales para construcción a bajo costo, a fin de mejorar las condiciones de la vivienda familiar.","a":["Dirección de Obras Públicas"],"u":"","m":""},{"c":"2.1.6.1","eje":"EJE II","o":"2.1","s":"2.1.1","d":"Construcción y rehabilitación en centros educativos con instalaciones seguras, incluyendo aulas, servicios sanitarios, bardas perimetrales, domos y sistemas eléctricos, que contribuya a mejorar la infraestructura física educativa.","a":[],"u":"","m":""},{"c":"2.1.6.2","eje":"EJE II","o":"2.1","s":"2.1.1","d":"Construcción de la biblioteca municipal y la rehabilitación de las bibliotecas existentes en el municipio.","a":["Dirección de Obras Públicas"],"u":"","m":""},{"c":"2.1.6.3","eje":"EJE II","o":"2.1","s":"2.1.1","d":"Rehabilitación, ampliación y/o mantenimiento de la Unidad Básica de Rehabilitación, así como algunos espacios establecidos por el sector salud.","a":[],"u":"","m":""},{"c":"2.2.1.1","eje":"EJE II","o":"2.2","s":"2.2.1","d":"Incrementar las actividades de barrido y limpieza de calles y avenidas de la cabecera municipal, villas y poblados del municipio.","a":["Dirección de Obras Públicas"],"u":"Km² de barrido","m":""},{"c":"2.2.1.2","eje":"EJE II","o":"2.2","s":"2.2.1","d":"Ampliar la cobertura de la recolección de basura, estableciendo rutas de servicio mejo let db=null, session=null, profile=null, saveQueue=Promise.resolve(), saveTimer=null, syncing=false;

let V={user:null,users:[],usersLoaded:false,usersLoading:false,usersError:'',viewAs:false,per:'P1',q:'',eje:'',est:'',open:null,lim:50,tab:'avance',sel:{},draft:null,cfgDraft:null,editCfg:false,lq:'',larea:'',leje:'',ltipo:'',lest:''};
const LB={};DATA.lines.forEach(l=>LB[l.c]=l);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);
const areaList=()=>[...DATA.areas,...S.areasX].map(a=>S.areaName[a]||a).sort((a,b)=>a.localeCompare(b,'es'));
const rawArea=n=>{for(const a of [...DATA.areas,...S.areasX]){if((S.areaName[a]||a)===n)return a}return n};
const areasOf=c=>(S.asg[c]!==undefined?S.asg[c]:LB[c].a).map(a=>S.areaName[a]||a);
const descOf=c=>(S.ov[c]&&S.ov[c].d)||LB[c].d;
const medioOf=c=>(S.ov[c]&&S.ov[c].m!==undefined)?S.ov[c].m:LB[c].m;
const units=()=>[...UNITS0,...S.units].filter(u=>u.on!==false);
const unitOf=n=>[...UNITS0,...S.units].find(u=>u.n===n);
const helpOf=k=>Object.assign({},HELP[k],S.help[k]||{});
const perOpen=id=>!(S.per[id]&&S.per[id].cerrado);
const perOf=id=>PER.find(p=>p.id===id);
const who=()=>!V.user?'':V.user.type==='tecso'?'TECSO':(V.viewAs?'TECSO (como '+V.user.name+')':V.user.name);
const log=(a,c,d)=>{S.log.unshift({t:Date.now(),u:who(),a,c:c||'',d:d||''});S.log=S.log.slice(0,500);save()};
const ST={POR_CONFIGURAR:['Por configurar','warn'],APLICADA:['Aplicada en periodo anterior','pri'],PENDIENTE:['Pendiente',''],BORRADOR:['Borrador',''],ENVIADA:['Enviada a TECSO','pri'],DEVUELTA:['Devuelta con observaciones','bad'],APROBADA:['Aprobada','ok'],CERRADO:['Periodo cerrado','']};
const ck=(c,p)=>c+'|'+p;
function closedBefore(c,pid){const i=PER.findIndex(p=>p.id===pid);for(let j=0;j<i;j++){const x=S.cap[ck(c,PER[j].id)];if(x&&x.estado==='CONCLUIDO'&&(x.rev==='ENVIADA'||x.rev==='APROBADA'))return PER[j]}return null}
function status(c,pid){if(!S.cfg[c])return 'POR_CONFIGURAR';if(closedBefore(c,pid))return 'APLICADA';const x=S.cap[ck(c,pid)];if(!x)return perOpen(pid)?'PENDIENTE':'CERRADO';return x.rev}
function prevCap(c,pid){const i=PER.findIndex(p=>p.id===pid);for(let j=i-1;j>=0;j--){const x=S.cap[ck(c,PER[j].id)];if(x&&x.estado)return{x,p:PER[j]}}return null}
const chipTipo=t=>t==='RECURRENTE'?'<span class="chip rec">Se repite cada periodo</span>':t==='HITO'?'<span class="chip hit">Proyecto con fin definido</span>':'';
const chipSt=s=>{const [l,k]=ST[s]||[s,''];return `<span class="chip ${k}">${l}</span>`};
const pn=v=>{if(v===null||v===undefined||String(v).trim()==='')return null;const n=Number(String(v).replace(',','.'));return isFinite(n)?n:NaN};

function hb(k){return `<button type="button" class="help" data-act="help" aria-expanded="false" aria-label="Ayuda: ${esc(helpOf(k).t)}">?</button>`}
function hbox(k){const h=helpOf(k);return `<div class="helpbox" hidden><p><b>Qué significa.</b> ${esc(h.q)}</p><p><b>De dónde sale el dato.</b> ${esc(h.d)}</p><p class="ok"><b>✔ Ejemplo correcto.</b> ${esc(h.ok)}</p><p class="no"><b>✖ Ejemplo incorrecto.</b> ${esc(h.no)}</p></div>`}
const fld=(k,label,inner,extra='')=>`<div class="field"><div class="lbl"><span>${label}</span>${hb(k)}</div>${hbox(k)}${inner}${extra}</div>`;

<aside class="login-aside"><h3>¿Qué podrá hacer aquí?</h3><p>✓ Capturar avances por periodo</p><p>✓ Guardar borradores y enviar reportes</p><p>✓ Consultar observaciones y estatus</p><p>✓ Registrar medios de verificación</p><hr style="border:0;border-top:1px solid var(--line);margin:16px 0"><div class="small mute" id="sync-status">Conexión institucional requerida</div></aside></div></div>`}
function linesOfArea(n){return DATA.lines.filter(l=>areasOf(l.c).includes(n))}
function viewArea(){if(V.open)return viewLine(V.open);const n=V.user.name,all=linesOfArea(n);
 const pid=V.per;let cnt={POR_CONFIGURAR:0,PENDIENTE:0,BORRADOR:0,ENVIADA:0,DEVUELTA:0,APROBADA:0,APLICADA:0,CERRADO:0};all.forEach(l=>cnt[status(l.c,pid)]++);
 const done=cnt.ENVIADA+cnt.APROBADA+cnt.APLICADA,cfgd=all.length-cnt.POR_CONFIGURAR;

 const ejes=[...new Set(all.map(l=>l.eje))];

 <div class="bar" style="margin:10px 0"><i style="width:${all.length?Math.round(done/all.length*100):0}%"></i></div>
 <div class="grid g5"><div class="stat"><b>${cfgd}/${all.length}</b><span>Líneas configuradas</span></div><div class="stat"><b>${cnt.PENDIENTE}</b><span>Pendientes del periodo</span></div><div class="stat"><b>${cnt.BORRADOR+cnt.DEVUELTA}</b><span>Borradores y devueltas</span></div><div class="stat"><b>${cnt.ENVIADA+cnt.APROBADA}</b><span>Enviadas o aprobadas</span></div><div class="stat"><b>${cnt.APLICADA}</b><span>Aplicadas en periodo anterior</span></div></div>
 ${cnt.POR_CONFIGURAR?`<div class="msg warn" style="margin-top:12px">Tiene <b>${cnt.POR_CONFIGURAR}</b> líneas por configurar. Antes de capturar, indique para cada una cómo se reporta y su unidad de medida.</div>`:''}</div>
 <div class="card"><div class="filters"><input type="search" placeholder="Buscar por código o texto" value="${esc(V.q)}" data-in="q"><select data-in="eje"><option value="">Todos los ejes</option>${ejes.map(e=>`<option ${V.eje===e?'selected':''} value="${e}">${e} · ${esc(DATA.ejes[e])}</option>`).join('')}</select><select data-in="est"><option value="">Todos los estados</option>${Object.keys(ST).map(k=>`<option value="${k}" ${V.est===k?'selected':''}>${ST[k][0]}</option>`).join('')}</select></div>
 ${rows.slice(0,V.lim).map(l=>lineRow(l,pid)).join('')||'<p class="mute">Sin resultados.</p>'}

function lineRow(l,pid){const c=S.cfg[l.c],s=status(l.c,pid),lead=areasOf(l.c)[0]!==V.user.name&&V.user.type==='area';
 return `<div class="row"><div class="code">${l.c}</div><div><div class="desc">${esc(descOf(l.c))}</div><div class="meta">${c?chipTipo(c.tipo):''}${c&&c.demanda?'<span class="chip">Depende de la demanda</span>':''}${c?`<span class="chip">${esc(c.unidad)}</span>`:''}${chipSt(s)}${lead?'<span class="chip">Colabora</span>':''}</div></div><div><button class="btn sm pri" data-act="open" data-c="${l.c}">${s==='POR_CONFIGURAR'?'Configurar':'Abrir'}</button></div></div>`}
function perTabs(){return `<div class="tabs" role="tablist">${PER.map(p=>`<button class="tab" role="tab" aria-selected="${V.per===p.id}" data-act="per" data-p="${p.id}">${p.l}${perOpen(p.id)?'':' (cerrado)'}</button>`).join('')}</div>`}

 const locked=cfg&&cfg.bloq&&V.user.type!=='tecso';
 const crumb=`<div class="crumb"><b>${l.eje}</b> · ${esc(DATA.ejes[l.eje])}<br>Objetivo ${l.o}: ${esc(DATA.objs[l.o]||'')}<br>Estrategia ${l.s}: ${esc(DATA.ests[l.s]||'')}</div>`;
 let h=`<div class="actions" style="margin:0 0 10px"><button class="btn sm" data-act="back">← Volver a mis líneas</button></div>
 <div class="card">${crumb}<h2 style="margin-top:10px">${l.c} · ${esc(descOf(c))}</h2><div class="small mute">Área: ${esc(areasOf(c).join(', ')||'Sin área')}</div></div>`;
 if(!cfg||V.editCfg)h+=cfgForm(c);else{
  h+=`<div class="card"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center"><div>${chipTipo(cfg.tipo)} ${cfg.demanda?'<span class="chip">Depende de la demanda</span>':''} <span class="chip">Unidad: ${esc(cfg.unidad)}</span></div>${locked?`<button class="btn sm" data-act="reqcfg" data-c="${c}">Solicitar cambio a TECSO</button>`:`<button class="btn sm" data-act="editcfg">Cambiar configuración</button>`}</div>${locked?'<p class="small mute" style="margin:8px 0 0">La configuración se bloquea al enviar el primer periodo. Para cambiarla, TECSO debe aprobar la solicitud.</p>':''}</div>`;

 return h}

function cfgForm(c){const d=V.cfgDraft||(V.cfgDraft=Object.assign({tipo:'',demanda:false,unidad:''},S.cfg[c]||{}));const l=LB[c];
 const tipoOpts=[['RECURRENTE','Se repite en cada periodo','Cada corte tiene su propia cantidad. Ejemplos: poda de árboles, patrullajes, consultas.'],['HITO','Es un proyecto con fin definido','Al concluirlo ya no se reporta más. Ejemplos: construir un hospital, publicar un reglamento.']];
 return `<div class="card"><h2>Configuración de la línea</h2><p class="mute small">Usted conoce mejor que nadie cómo se trabaja esta línea. Complete estos datos una sola vez; el formulario de captura se adapta a lo que elija.</p>
 ${fld('tipo','¿Cómo se reporta esta línea?',tipoOpts.map(o=>`<label class="opt ${d.tipo===o[0]?'sel':''}"><input type="checkbox" data-cfg="tipo" value="${o[0]}" ${d.tipo===o[0]?'checked':''}><div><b>${o[1]}</b><span>${o[2]}</span></div></label>`).join(''))}
 ${d.tipo==='RECURRENTE'?fld('demanda','Depende de la demanda',`<label class="opt ${d.demanda?'sel':''}"><input type="checkbox" data-cfg="demanda" ${d.demanda?'checked':''}><div><b>Marcar si en algunos periodos puede no haber casos</b><span>Ejemplo: atención de emergencias o solicitudes ciudadanas.</span></div></label>`):''}
 ${fld('unidad','Unidad de medida',`<select data-cfg="unidad"><option value="">Elija la unidad…</option>${units().map(u=>`<option ${d.unidad===u.n?'selected':''}>${esc(u.n)}</option>`).join('')}</select>`,`<div class="small mute" style="margin-top:6px">${l.u?`En el Formato A esta línea se reportó como: <b>${esc(l.u)}</b>. `:''}<a href="#" data-act="newunit" data-c="${c}">Mi unidad no está en la lista</a></div>`)}
 <div class="actions"><button class="btn pri" data-act="savecfg" data-c="${c}">Guardar configuración</button>${S.cfg[c]?'<button class="btn" data-act="cancelcfg">Cancelar</button>':''}</div></div>`}

function capForm(c,pid){const cfg=S.cfg[c],per=perOf(pid),x=S.cap[ck(c,pid)],cb=closedBefore(c,pid);
 if(cb)return `<div class="card"><div class="msg info"><b>Aplicada en periodo anterior.</b> Este proyecto se concluyó en ${cb.l}. Ya no requiere reporte en ${per.l}.</div></div>`;
 const ro=(x&&(x.rev==='ENVIADA'||x.rev==='APROBADA'))||!perOpen(pid);
 if(!V.draft||V.draft._k!==ck(c,pid))V.draft=Object.assign({_k:ck(c,pid),estado:'',cantidad:'',motivo:'',motivoTxt:'',etapa:'',avance:'',narrativa:'',medio:medioOf(c)||'',evidencia:'',aviso:false},x||{});
 const d=V.draft,rec=cfg.tipo==='RECURRENTE',u=unitOf(cfg.unidad)||{t:'ENTERO'};const dis=ro?'disabled':'';
 const pv=prevCap(c,pid);
 let h=`<div class="card"><h2>Reporte de ${per.l}</h2>`;
 if(!perOpen(pid))h+=`<div class="msg warn">TECSO cerró este periodo. Solo se puede consultar.</div>`;
 if(x&&x.rev==='DEVUELTA')h+=`<div class="msg bad"><b>TECSO devolvió esta captura.</b> ${esc(x.obs||'')}</div>`;
 if(x&&x.rev==='ENVIADA')h+=`<div class="msg info">Enviada a TECSO. Queda bloqueada mientras se revisa.</div>`;
 if(x&&x.rev==='APROBADA')h+=`<div class="msg ok">Aprobada por TECSO.</div>`;
 if(pv)h+=`<div class="msg info small"><b>Periodo anterior (${pv.p.l}):</b> ${pv.x.cantidad!==''&&pv.x.cantidad!==undefined?esc(pv.x.cantidad)+' '+esc(cfg.unidad)+'. ':''}${pv.x.avance!==''&&pv.x.avance!==undefined&&!rec?'Avance '+esc(pv.x.avance)+'%. ':''}${esc((pv.x.narrativa||'').slice(0,160))}</div>`;
 h+='<div id="errs"></div>';
 const radios=(opts)=>opts.map(o=>`<label class="opt ${d.estado===o[0]?'sel':''}"><input type="checkbox" data-f="estado" value="${o[0]}" ${d.estado===o[0]?'checked':''} ${dis}><div><b>${o[1]}</b><span>${o[2]}</span></div></label>`).join('');
 if(rec){h+=fld('estado_rec','Estado en este periodo',radios([['CON_AVANCE','Con avance','Hubo trabajo en esta línea en los meses del periodo.'],['SIN_ACTIVIDAD','Sin actividad','No hubo trabajo. Explique el motivo.']]));
  if(d.estado==='CON_AVANCE')h+=fld('cantidad',`Cantidad realizada en ${per.l} (${esc(cfg.unidad)})`,`<div class="suffix"><input type="text" inputmode="decimal" data-f="cantidad" value="${esc(d.cantidad)}" ${dis} autocomplete="off"><span class="mute">${esc(cfg.unidad)}</span></div>`);
  if(d.estado==='SIN_ACTIVIDAD'){h+=fld('motivo','Motivo',`<select data-f="motivo" ${dis}><option value="">Elija el motivo…</option>${MOTIVOS.map(m=>`<option ${d.motivo===m?'selected':''}>${esc(m)}</option>`).join('')}</select>`);
   if(/otra área|Otro/.test(d.motivo))h+=`<div class="field"><input type="text" data-f="motivoTxt" placeholder="Explique brevemente" value="${esc(d.motivoTxt)}" ${dis}></div>`}}
 else{h+=fld('estado_hito','Estado del proyecto',radios([['NO_INICIA','Aún no inicia','Programado para un periodo posterior. No cuenta como incumplimiento.'],['EN_PROCESO','En proceso','Ya hay trabajo y falta terminar.'],['CONCLUIDO','Concluido','El proyecto terminó por completo.']]));
  if(d.estado==='EN_PROCESO'){h+=fld('etapa','Etapa',`<select data-f="etapa" ${dis}><option value="">Elija la etapa…</option>${ETAPAS.map(m=>`<option ${d.etapa===m?'selected':''}>${m}</option>`).join('')}</select>`);
   h+=fld('avance','Avance acumulado del proyecto (%)',`<div class="suffix"><input type="text" inputmode="numeric" data-f="avance" value="${esc(d.avance)}" ${dis}><span class="mute">%</span></div>`)}
  if(d.estado==='CONCLUIDO')h+=`<div class="msg info small">Al concluir, el avance queda en 100% y los periodos siguientes se marcan como aplicados.</div>`;
  if(d.estado&&d.estado!=='NO_INICIA')h+=fld('cantidad',`Cantidad entregada en ${per.l} (${esc(cfg.unidad)}, opcional)`,`<div class="suffix"><input type="text" inputmode="decimal" data-f="cantidad" value="${esc(d.cantidad)}" ${dis}><span class="mute">${esc(cfg.unidad)}</span></div>`)}
 const need=rec?d.estado==='CON_AVANCE':d.estado&&d.estado!=='NO_INICIA';
 if(d.estado){

  if(need)h+=fld('medio','Medio de verificación',`<input type="text" list="dl-medios" data-f="medio" value="${esc(d.medio)}" ${dis}><datalist id="dl-medios">${MEDIOS.map(m=>`<option>${m}</option>`).join('')}</datalist>`);
  if(need)h+=fld('evidencia','Evidencia'+((d.estado==='CONCLUIDO')?'':' (recomendada)'),`<input type="text" data-f="evidencia" placeholder="Nombre o enlace del documento" value="${esc(d.evidencia)}" ${dis}>`)}
 if(!ro){h+=`<div class="actions"><button class="btn" data-act="draft" data-c="${c}">Guardar borrador</button><button class="btn pri" data-act="send" data-c="${c}">Enviar a TECSO</button>${hb('enviar')}</div>${hbox('enviar')}<p class="small mute">Guardar como borrador no exige tener todo completo. Al enviar se revisan los campos obligatorios.</p>`}
 else if(V.user.type==='tecso'||V.viewAs){}
 return h+'</div>'}

function validate(c,d,final){const cfg=S.cfg[c],rec=cfg.tipo==='RECURRENTE',u=unitOf(cfg.unidad)||{t:'ENTERO'},E=[],W=[],per=perOf(V.per);
 const q=pn(d.cantidad);
 if(d.cantidad!==''&&d.cantidad!==undefined&&isNaN(q))E.push('La cantidad solo acepta números.');
 if(q!==null&&!isNaN(q)){if(q<0)E.push('La cantidad no puede ser negativa.');if(u.t==='ENTERO'&&!Number.isInteger(q))E.push('La unidad "'+cfg.unidad+'" se cuenta en números enteros.');if(u.t==='PORCENTAJE'&&(q<0||q>100))E.push('Un porcentaje va de 0 a 100.')}
 if(!final)return{E,W};
 if(!d.estado)E.push('Elija el estado del periodo.');
 if(rec){if(d.estado==='CON_AVANCE'){if(q===null)E.push('Escriba la cantidad realizada.');else if(!isNaN(q)&&q===0)E.push('Si la cantidad es 0, elija "Sin actividad" y explique el motivo.')}
  if(d.estado==='SIN_ACTIVIDAD'){if(!d.motivo)E.push('Elija el motivo de la falta de actividad.');else if(/otra área|Otro/.test(d.motivo)&&!(d.motivoTxt||'').trim())E.push('Explique el motivo en el campo de texto.')}}

async function invokeUsers(body){
 try{
  const {data,error}=await db.functions.invoke('manage-users',{body});
  if(!error)return {data,error:null};
  let status=error.context?.status,detail='';
  try{const t=await error.context.text();try{const j=JSON.parse(t);detail=j.error||j.message||j.msg||t}catch{detail=t}}catch{}
  console.error('manage-users',status,detail,error);
  let msg;
  if(status===404)msg='La función manage-users no existe en este proyecto de Supabase (404). Verifique el nombre exacto y que esté desplegada.';
  else if(status===401)msg='Supabase rechazó la sesión (401'+(detail?': '+detail:'')+'). Si dice "Invalid JWT", desactive "Verify JWT" en la función manage-users.';
  else if(status)msg='Error '+status+(detail?': '+detail:'');
  else msg='No se pudo contactar la función (posible CORS o función no desplegada). '+(error.message||'');
  return {data:{error:msg},error};
 }catch(e){console.error('manage-users',e);return {data:{error:'Error de red: '+(e.message||e)},error:e}}
}

 session=sess;
 const {data:prof,error:perr}=await db.from('pmd_profiles').select('role,area_name,active').eq('user_id',sess.user.id).single();
 if(perr||!prof||!prof.active){await db.auth.signOut();session=null;showBackendError('Su cuenta no tiene un perfil activo. Solicite al administrador que le asigne un área y rol.');render();return}
 profile=prof;
 const {data:row,error}=await db.from('pmd_app_state').select('payload').eq('id',1).maybeSingle();
 if(error){showBackendError('No se pudo cargar la información institucional: '+error.message);await db.auth.signOut();session=null;render();return}
 syncing=true;S=Object.assign(JSON.parse(JSON.stringify(EMPTY_STATE)),row?.payload||{});syncing=false;
 V.user=prof.role==='admin'?{type:'tecso'}:{type:'area',name:prof.area_name};
 V.viewAs=false;V.open=null;V.per='P1';V.tab='avance';render();setSyncStatus('Conectado · datos compartidos');
 db.channel('pmd-state-live').on('postgres_changes',{event:'UPDATE',schema:'public',table:'pmd_app_state',filter:'id=eq.1'},payload=>{if(!payload.new||!payload.new.payload)return;syncing=true;S=Object.assign(JSON.parse(JSON.stringify(EMPTY_STATE)),payload.new.payload);syncing=false;const keep=V.open;render();if(keep&&V.user?.type==='area'){V.open=keep;render()}setSyncStatus('Datos actualizados desde el servidor')}).subscribe();
}
async function boot(){
 if(!window.SUPABASE_URL||!window.SUPABASE_ANON_KEY||!window.supabase){render();showBackendError('Falta configurar la conexión institucional. Revise config.js y la guía de instalación.');return}
 db=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);
 const {data:{session:sess}}=await db.auth.getSession();
 if(sess)await establishSession(sess);else render();
 db.auth.onAuthStateChange((event,newSession)=>{if(event==='SIGNED_OUT'){session=null;profile=null;V.user=null;render()}else if(event==='SIGNED_IN'&&newSession&&!V.user)setTimeout(()=>establishSession(newSession),0)});
}
boot();
</script>
